version: 2.1

# Same jobs as .github/workflows, for when GitHub Actions is unavailable.
#
#   push (any branch) -> test, then benchmark the toolchains the push changed
#   push to main      -> ...and publish the results into data/ (a [skip ci] commit, which redeploys the site)
#   manual trigger    -> set `bench_toolchains` to "all" or a comma-separated list of toolchain ids
#   daily schedule    -> set `run_versions` to true: bump toolchains and open a pull request
#
# Project environment variable GH_BOT_TOKEN: a fine-grained GitHub token for this repository with
# Contents and Pull requests write access. It pushes results and the version bot's branch.

parameters:
  bench_toolchains:
    type: string
    default: ""
  run_versions:
    type: boolean
    default: false

executors:
  py:
    docker:
      - image: cimg/python:3.13.16-node
    resource_class: medium
  # Measurements need a real Docker daemon and 4 dedicated cores to match the ci-4vcpu profile.
  bench-machine:
    machine:
      image: ubuntu-2404:current
    resource_class: large

commands:
  python-env:
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements-dev.txt" }}
      - run: python -m pip install -q -r requirements-dev.txt
      - save_cache:
          key: pip-v1-{{ checksum "requirements-dev.txt" }}
          paths: [~/.cache/pip]

jobs:
  test:
    executor: py
    steps:
      - checkout
      - python-env
      - run: python -m pytest -q tests
      - run: python -m runner list
      - run: sudo npm install -g pnpm@11.17.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "web/pnpm-lock.yaml" }}
      - run:
          working_directory: web
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "web/pnpm-lock.yaml" }}
          paths: [~/.local/share/pnpm/store]
      - run:
          working_directory: web
          command: pnpm typecheck && pnpm lint && pnpm build
          environment:
            NEXT_TELEMETRY_DISABLED: "1"

  plan:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - run:
          name: Choose toolchains
          command: .circleci/scripts/plan.sh
          environment:
            REQUESTED: << pipeline.parameters.bench_toolchains >>
            BASE_REVISION: << pipeline.git.base_revision >>
      - persist_to_workspace:
          root: .work
          paths: [plan.txt]

  bench:
    executor: bench-machine
    parallelism: 4
    steps:
      - checkout
      - attach_workspace:
          at: .work
      - run:
          name: Build and measure
          command: .circleci/scripts/bench.sh
          no_output_timeout: 30m
          environment:
            REQUESTED: << pipeline.parameters.bench_toolchains >>
      - store_artifacts:
          path: .work/results
      - store_artifacts:
          path: .work/logs
      - persist_to_workspace:
          root: .work
          paths: [results]

  publish:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - attach_workspace:
          at: .work
      - run: .circleci/scripts/publish.sh

  versions:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - run: .circleci/scripts/versions.sh

workflows:
  build:
    when:
      not: << pipeline.parameters.run_versions >>
    jobs:
      - test
      - plan
      - bench:
          requires: [plan]
      - publish:
          requires: [bench, test]
          filters:
            branches:
              only: main

  versions:
    when: << pipeline.parameters.run_versions >>
    jobs:
      - versions
