version: 2.1

# Fallback for .github/workflows/bench.yml. GitHub Actions is the primary runner; when its plan, bench or
# publish job fails, bench.yml triggers this pipeline through the API with `fallback` = true.
#
#   fallback = true        -> test, benchmark the toolchains GitHub Actions was asked to run, publish to main
#   bench_toolchains set   -> manual run: "all" or a comma-separated list of toolchain ids
#   run_versions = true    -> bump toolchains and open a pull request (optional schedule)
#   anything else (a push) -> does nothing, so CircleCI credits are not spent while Actions works
#
# Project environment variable GH_BOT_TOKEN: a fine-grained GitHub token for this repository with
# Contents and Pull requests write access. It pushes results and the version bot's branch.

parameters:
  fallback:
    type: boolean
    default: false
  base_revision:
    type: string
    default: ""
  bench_toolchains:
    type: string
    default: ""
  run_versions:
    type: boolean
    default: false

executors:
  py:
    docker:
      - image: cimg/python:3.13.16-node
    resource_class: medium
  # Measurements need a real Docker daemon and 4 dedicated cores to match the ci-4vcpu profile.
  bench-machine:
    machine:
      image: ubuntu-2404:current
    resource_class: large

commands:
  python-env:
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements-dev.txt" }}
      - run: python -m pip install -q -r requirements-dev.txt
      - save_cache:
          key: pip-v1-{{ checksum "requirements-dev.txt" }}
          paths: [~/.cache/pip]

jobs:
  test:
    executor: py
    steps:
      - checkout
      - python-env
      - run: python -m pytest -q tests
      - run: python -m runner list
      - run: sudo npm install -g pnpm@11.17.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "web/pnpm-lock.yaml" }}
      - run:
          working_directory: web
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "web/pnpm-lock.yaml" }}
          paths: [~/.local/share/pnpm/store]
      - run:
          working_directory: web
          command: pnpm typecheck && pnpm lint && pnpm build
          environment:
            NEXT_TELEMETRY_DISABLED: "1"

  plan:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - run:
          name: Choose toolchains
          command: .circleci/scripts/plan.sh
          environment:
            REQUESTED: << pipeline.parameters.bench_toolchains >>
            BASE_REVISION: << pipeline.parameters.base_revision >>
      - persist_to_workspace:
          root: .work
          paths: [plan.txt]

  bench:
    executor: bench-machine
    parallelism: 8
    steps:
      - checkout
      - attach_workspace:
          at: .work
      - run:
          name: Build and measure
          command: .circleci/scripts/bench.sh
          no_output_timeout: 30m
          environment:
            REQUESTED: << pipeline.parameters.bench_toolchains >>
      - store_artifacts:
          path: .work/results
      - store_artifacts:
          path: .work/logs
      - persist_to_workspace:
          root: .work
          paths: [results]

  publish:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - attach_workspace:
          at: .work
      - run: .circleci/scripts/publish.sh

  skipped:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run: echo "GitHub Actions is the primary runner; this pipeline only runs as its fallback."

  versions:
    executor: py
    resource_class: small
    steps:
      - checkout
      - python-env
      - run: .circleci/scripts/versions.sh

workflows:
  build:
    when:
      and:
        - not: << pipeline.parameters.run_versions >>
        - or:
            - << pipeline.parameters.fallback >>
            - << pipeline.parameters.bench_toolchains >>
    jobs:
      - test
      - plan
      - bench:
          requires: [plan]
      - publish:
          requires: [bench, test]
          filters:
            branches:
              only: main

  versions:
    when: << pipeline.parameters.run_versions >>
    jobs:
      - versions

  # A push that starts a pipeline with no parameters ends here instead of failing with "no workflow".
  idle:
    when:
      and:
        - not: << pipeline.parameters.run_versions >>
        - not: << pipeline.parameters.fallback >>
        - not: << pipeline.parameters.bench_toolchains >>
    jobs:
      - skipped

